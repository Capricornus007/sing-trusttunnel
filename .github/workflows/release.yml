name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
            goarm: ''
            ext: ''
          - target: linux-arm64
            goos: linux
            goarch: arm64
            goarm: ''
            ext: ''
          - target: linux-armv7
            goos: linux
            goarch: arm
            goarm: '7'
            ext: ''
          - target: linux-386
            goos: linux
            goarch: '386'
            goarm: ''
            ext: ''
          # 用戶 2026-10-11 裁：其他系統整條刪。
          # 移除 freebsd-amd64、darwin-amd64、darwin-arm64、
          # windows-amd64、windows-arm64、windows-386 六條交叉編譯目標
          # （只有原 windows 條目的 ext 是 .exe，剩下的 ext 全為空字串，
          #  Build 步的 ${{ matrix.ext }} 照原樣保留、不改腳本）。
          # Publish job 用 download-artifact 的 merge-multiple 收全部產物，
          # 沒有逐目標的引用需要清；needs: build 的 build job 仍存在。
          # 未擅自補 android 目標（那是用戶真正要發的包的平台，怎麼建請主代理裁）。
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Install Go from the feed (golang/go master tip)
        uses: Capricornus007/repo/.github/actions/setup-feed-go@master
      # 原本那步 Go 安裝順帶開了 module 快取（依 go.sum）與 check-latest；
      # 版本現在由 feed 決定，check-latest 無意義；composite 不管快取 → 顯式補一步。
      - name: Cache go module
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
          key: go-${{ hashFiles('**/go.sum') }}
      - name: Build
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        run: |
          binary="sing-trusttunnel-${RELEASE_TAG}-${{ matrix.target }}${{ matrix.ext }}"

          mkdir -p dist
          go build -v -trimpath -ldflags='-w -s -buildid=' -tags "with_quic" -o "dist/${binary}" ./cmd/sing-trusttunnel
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          if-no-files-found: error
          path: dist/sing-trusttunnel-*

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* --clobber
          else
            gh release create "${RELEASE_TAG}" dist/* --title "${RELEASE_TAG}"
          fi
