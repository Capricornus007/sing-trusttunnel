name: test

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/test.yml'
  pull_request:

jobs:
  build:
    # Go 改吃 feed 的 go-git（golang/go master tip），原本 name 裡的「(Go x.y.z)」
    # 不再有資料來源，改成只標平台。
    name: Linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # 用戶 2026-10-11 裁：其他系統整條刪（macos-latest / windows-latest 已移除）。
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Go from the feed (golang/go master tip)
        uses: Capricornus007/repo/.github/actions/setup-feed-go@master
      # 原本那步 Go 安裝順帶開了 module 快取（依 go.sum）；composite 不管快取 → 顯式補一步。
      - name: Cache go module
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
          key: go-${{ hashFiles('**/go.sum') }}
      - name: Build
        run: |
          make test
